<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>DerivAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0f1e;color:#f1f5f9;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{width:100%;max-width:400px;background:#111827;border:1px solid #1f2d45;border-radius:20px;padding:28px;}
.logo{text-align:center;margin-bottom:24px;}
.logo h1{font-size:28px;font-weight:700;color:#f1f5f9;}
.logo h1 span{color:#38bdf8;}
.logo p{font-size:10px;color:#475569;letter-spacing:3px;margin-top:4px;}
.logo small{font-size:10px;color:#38bdf8;font-weight:700;}
.err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:12px;margin-bottom:14px;color:#ef4444;font-size:13px;}
.lbl{font-size:10px;font-weight:600;color:#475569;letter-spacing:1px;margin-bottom:6px;}
.inp-wrap{position:relative;margin-bottom:6px;}
input{width:100%;padding:14px 44px 14px 14px;background:#0a0f1e;border:1px solid #1f2d45;border-radius:10px;color:#f1f5f9;font-size:13px;font-family:monospace;outline:none;-webkit-appearance:none;}
input:focus{border-color:#38bdf8;}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#475569;cursor:pointer;font-size:18px;}
.hint{font-size:10px;color:#334155;text-align:center;margin-bottom:18px;}
.btn-main{width:100%;padding:15px;background:#ef4444;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;box-shadow:0 4px 20px rgba(239,68,68,.35);}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.divider div{flex:1;height:1px;background:#1f2d45;}
.divider span{color:#334155;font-size:11px;}
.btn-guest{width:100%;padding:13px;background:transparent;border:1px solid #1f2d45;border-radius:12px;color:#475569;font-size:13px;cursor:pointer;}
.footer{text-align:center;margin-top:14px;font-size:10px;color:#1e293b;}
/* App screen */
#app{display:none;text-align:center;padding:40px 20px;}
#app h2{color:#22c55e;font-size:24px;margin-bottom:12px;}
#app p{color:#94a3b8;font-size:14px;margin-bottom:8px;}
#app button{padding:12px 24px;background:#1f2d45;border:none;border-radius:10px;color:#94a3b8;font-size:13px;cursor:pointer;margin-top:16px;}
</style>
</head>
<body>

<div id="loginPage">
  <div class="card">
    <div class="logo">
      <h1>Deriv<span>AI</span></h1>
      <p>PIONEER &middot; POWER &middot; BOY BOY</p>
      <small>v10 LATEST</small>
    </div>
    <div id="LE" class="err"></div>
    <div class="lbl">YOUR API TOKEN</div>
    <div class="inp-wrap">
      <input id="tok" type="password" placeholder="pat_xxxxxxxxxxxxxxxxxxxxxxxx"/>
      <button class="eye" type="button" onclick="var i=document.getElementById('tok');i.type=i.type=='password'?'text':'password';">&#128065;</button>
    </div>
    <div class="hint">Token sent directly to Deriv &middot; Never stored &middot; Never shared</div>
    <button class="btn-main" type="button" id="btn" onclick="doConnect()">&#128308; CONNECT TO DERIV</button>
    <div class="divider"><div></div><span>or</span><div></div></div>
    <button class="btn-guest" type="button" onclick="doGuest()">Continue without token (analysis only)</button>
  </div>
  <div class="footer">Not financial advice &middot; Use demo first &middot; Trade at your own risk</div>
</div>

<div id="app">
  <h2>&#10003; Connected!</h2>
  <p id="appName"></p>
  <p id="appBal"></p>
  <p id="appType"></p>
  <button onclick="location.reload()">Logout</button>
</div>

<script>
function showErr(msg) {
  var el = document.getElementById('LE');
  el.textContent = msg;
  el.style.display = 'block';
}
function setBtn(txt, dis) {
  var b = document.getElementById('btn');
  b.textContent = txt;
  b.disabled = dis;
  b.style.opacity = dis ? '0.6' : '1';
}
function doGuest() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('appName').textContent = 'Guest mode - analysis only';
  document.getElementById('appBal').textContent = '';
  document.getElementById('appType').textContent = '';
}
function doConnect() {
  var token = document.getElementById('tok').value.trim();
  if (!token) { showErr('Please paste your API token'); return; }
  if (token.length < 10) { showErr('Token too short'); return; }
  document.getElementById('LE').style.display = 'none';
  setBtn('CONNECTING...', true);
  var ws;
  try {
    ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=36544');
  } catch(e) {
    showErr('Cannot connect: ' + e.message);
    setBtn('CONNECT TO DERIV', false);
    return;
  }
  var done = false;
  var timer = setTimeout(function() {
    if (done) return;
    done = true;
    try { ws.close(); } catch(x) {}
    showErr('Timed out. Try again.');
    setBtn('CONNECT TO DERIV', false);
  }, 15000);
  ws.onopen = function() {
    setBtn('AUTHORIZING...', true);
    ws.send(JSON.stringify({authorize: token}));
  };
  ws.onmessage = function(e) {
    var d; try { d = JSON.parse(e.data); } catch(x) { return; }
    if (d.msg_type !== 'authorize') return;
    clearTimeout(timer); done = true;
    try { ws.close(); } catch(x) {}
    if (d.error) {
      showErr('Error: ' + (d.error.message || 'Invalid token'));
      setBtn('CONNECT TO DERIV', false);
      return;
    }
    var a = d.authorize;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('appName').textContent = 'Welcome ' + (a.fullname || a.email || 'Trader');
    document.getElementById('appBal').textContent = 'Balance: ' + (a.currency||'USD') + ' ' + parseFloat(a.balance||0).toFixed(2);
    document.getElementById('appType').textContent = a.is_virtual ? 'Demo Account' : 'Real Account';
  };
  ws.onerror = function() {
    if (done) return;
    clearTimeout(timer); done = true;
    try { ws.close(); } catch(x) {}
    showErr('Connection error. Try again.');
    setBtn('CONNECT TO DERIV', false);
  };
  ws.onclose = function(ev) {
    if (done) return;
    clearTimeout(timer); done = true;
    showErr('Connection closed (code:' + ev.code + '). Try again.');
    setBtn('CONNECT TO DERIV', false);
  };
}
</script>
</body>
</html>
